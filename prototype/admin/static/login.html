<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI受電 管理（試作）ログイン</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<main class="login">
  <h1>AI受電 管理（試作）</h1>
  <p class="demo-banner">デモ・試作：会社の回線には接続していません。架空のデータだけを使います。</p>
  <form id="loginForm">
    <label>ユーザー名 <input id="username" name="username" autocomplete="username" value="admin" required></label>
    <label>パスワード <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">ログイン</button>
    <p id="err" class="error" role="alert"></p>
  </form>
  <p class="sub">初回のパスワードは、サーバーを起動したときのコンソールに1回だけ表示されます。</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
