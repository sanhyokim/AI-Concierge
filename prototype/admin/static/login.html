<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI受電 管理（試作）ログイン</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<main class="login">
  <div class="brand"><span class="mark" aria-hidden="true">野</span>AI受電 管理<span class="tag">試作</span></div>
  <form id="loginForm" class="card">
    <h2>ログイン</h2>
    <label>ユーザー名 <input id="username" name="username" autocomplete="username" value="admin" required></label>
    <label>パスワード <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">ログイン</button>
    <p id="err" class="error" role="alert"></p>
    <p class="sub">初回のパスワードは、サーバーを起動したときの黒い画面に1回だけ表示されます。</p>
  </form>
  <p class="demo-note">試作です。会社の回線にはつながっていません。架空のデータだけを使います。</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
